<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Handball Manager</title>
    <base href="./" />
    <!-- iPhone : application plein écran une fois ajoutée à l'écran d'accueil -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Handball" />
    <meta name="theme-color" content="#050F2A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/jeu.css" />
    <link rel="stylesheet" href="css/jeu-v2.css" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link href="HandballManagerWeb.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" href="icon-192.png" />
</head>

<body>
    <div id="app">
        <div class="chargement">
            <div class="chargement-logo"><span class="barre"></span><div><b>HANDBALL</b><b class="rouge">MANAGER</b></div></div>
            <div class="chargement-texte">Chargement…</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Une erreur est survenue.
        <a href="" class="reload">Recharger</a>
        <a class="dismiss">✕</a>
    </div>
    <script src="js/hbm.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>
</body>

</html>
