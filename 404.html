<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Handball Manager</title>
    <base href="./" />
    <!-- iPhone : application plein écran une fois ajoutée à l'écran d'accueil -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Handball" />
    <meta name="theme-color" content="#050F2A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/jeu.css" />
    <link rel="stylesheet" href="css/jeu-v2.css" />
    <link rel="stylesheet" href="css/gestes.css?v=29" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link href="HandballManagerWeb.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" href="icon-192.png" />
</head>

<body>
    <div id="app">
        <div class="chargement">
            <div class="chargement-logo"><span class="barre"></span><div><b>HANDBALL</b><b class="rouge">MANAGER</b></div></div>
            <div class="chargement-texte">Chargement…</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Une erreur est survenue.
        <a href="" class="reload">🔧 Réparer</a>
        <a class="dismiss">✕</a>
    </div>
    <script src="js/hbm.js?v=29"></script>
    <script src="js/hbm-pack3d.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        // Hors ligne : le service worker garde l'appli. Une nouvelle version s'installe et la page se recharge toute seule.
        if ('serviceWorker' in navigator) {
            const avaitUneVersion = !!navigator.serviceWorker.controller;
            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });
            let recharge = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (avaitUneVersion && !recharge) { recharge = true; location.reload(); }
            });
        }
        // En cas d'erreur : « Réparer » vide les fichiers en cache (la partie, elle, est gardée) et recharge
        document.querySelector('#blazor-error-ui .reload').addEventListener('click', async e => {
            e.preventDefault();
            try {
                for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
                for (const k of await caches.keys()) await caches.delete(k);
            } catch (x) { }
            location.reload();
        });
    </script>
</body>

</html>
